<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="title"><title id="title">Select a calculation, make a node, reuse it in another graph.</title><rect width="1200" height="300" rx="16" fill="#131b25"/><g font-family="Inter,Segoe UI,Arial,sans-serif"><g font-size="12" fill="#8da4c3" letter-spacing="2"><text x="38" y="42">01 / CONNECT</text><text x="476" y="42">02 / MAKE NODE</text><text x="872" y="42">03 / REUSE</text></g><g stroke="#718daf" stroke-width="2" fill="none"><path d="M135 113C160 113 160 160 187 160M135 207C160 207 160 160 187 160M259 160H295"/><path d="M380 160H437M781 160H834" stroke-dasharray="4 6"/><path d="M925 113C950 113 950 160 976 160M925 207C950 207 950 160 976 160M1118 160H1150"/></g><g fill="#202d3f" stroke="#425975"><rect x="49" y="87" width="86" height="52" rx="9"/><rect x="49" y="181" width="86" height="52" rx="9"/><rect x="187" y="134" width="72" height="52" rx="9"/><rect x="295" y="134" width="67" height="52" rx="9"/><rect x="869" y="87" width="56" height="52" rx="9"/><rect x="869" y="181" width="56" height="52" rx="9"/></g><g fill="#e1e9f5" font-size="20" text-anchor="middle"><text x="92" y="120">A</text><text x="92" y="214">B</text><text x="223" y="168">+</text><text x="329" y="168">x²</text><text x="897" y="120">2</text><text x="897" y="214">3</text></g><rect x="475" y="83" width="280" height="154" rx="12" fill="#1e2b3d" stroke="#6585bd"/><path d="M475 124H755" stroke="#3d5274"/><text x="495" y="110" font-size="16" font-weight="600" fill="#edf3ff">Whole Square</text><g fill="#a7bbd5" font-size="14"><text x="495" y="157">A</text><text x="495" y="204">B</text><text x="656" y="180">(A+B)²</text></g><g fill="#9bb7dd"><circle cx="475" cy="153" r="5"/><circle cx="475" cy="200" r="5"/><circle cx="755" cy="175" r="5"/></g><rect x="976" y="117" width="142" height="86" rx="10" fill="#203630" stroke="#4b9c80"/><text x="990" y="144" font-size="12" fill="#9dc5b7">Whole Square</text><text x="990" y="182" font-size="26" fill="#86dfbe" font-weight="600">25</text><g fill="#86dfbe"><circle cx="976" cy="160" r="5"/><circle cx="1118" cy="160" r="5"/></g><g fill="#7189a9" font-size="12"><text x="49" y="272">The original graph stays inside.</text><text x="475" y="272">Name it. Expose the inputs and outputs.</text><text x="869" y="272">Use it anywhere. Share the .mnode.</text></g></g></svg>