<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="440" viewBox="0 0 1400 440" role="img" aria-labelledby="title desc"><title id="title">MathNode — Make the math visible.</title><desc id="desc">A visual mathematics workspace. Two values connect through addition and a square operation to produce 25.</desc><defs><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#273342"/></pattern></defs><rect width="1400" height="440" rx="20" fill="#111820"/><rect width="1400" height="440" rx="20" fill="url(#dots)"/><path d="M685 52V388" stroke="#2b3441"/><g transform="translate(56 56) scale(.63)"><g><rect x="2" y="2" width="92" height="92" rx="23" fill="#23385f" stroke="#5b83cf" stroke-width="2"/><path d="M23 69V28L48 53L73 28V69" fill="none" stroke="#edf3ff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><g stroke="#23385f" stroke-width="3"><circle cx="23" cy="28" r="6" fill="#a9c7ff"/><circle cx="48" cy="53" r="6" fill="#a9c7ff"/><circle cx="73" cy="69" r="6" fill="#68d5b0"/></g></g></g><g font-family="Inter,Segoe UI,Arial,sans-serif"><text x="134" y="103" font-size="46" font-weight="700" fill="#f2f5fb" letter-spacing="-1.5">MathNode</text><text x="58" y="169" font-size="12" font-weight="600" letter-spacing="3" fill="#8ca7c7">VISUAL MATHEMATICS</text><text x="56" y="226" font-size="42" font-weight="600" letter-spacing="-1.3" fill="#f2f5fb">Make the math visible.</text><text x="58" y="268" font-size="18" fill="#a3b1c4">Numbers, symbols, and reusable calculations.</text><g font-size="12" fill="#b7c6da"><rect x="58" y="316" width="112" height="30" rx="15" fill="#1e2b3d"/><text x="77" y="336">LaTeX formulas</text><rect x="181" y="316" width="124" height="30" rx="15" fill="#1e2b3d"/><text x="200" y="336">Reusable nodes</text><rect x="316" y="316" width="111" height="30" rx="15" fill="#1e2b3d"/><text x="336" y="336">MCP for agents</text></g><g fill="none" stroke="#7b99bc" stroke-width="3"><path d="M850 153C887 153 886 223 920 223"/><path d="M850 293C887 293 886 223 920 223"/><path d="M1070 223H1156"/></g><g><rect x="726" y="113" width="124" height="80" rx="12" fill="#1d2631" stroke="#3a4a60"/><rect x="726" y="253" width="124" height="80" rx="12" fill="#1d2631" stroke="#3a4a60"/><rect x="920" y="178" width="150" height="90" rx="12" fill="#1d2631" stroke="#3a4a60"/><rect x="1156" y="178" width="168" height="90" rx="12" fill="#203330" stroke="#498f7b"/></g><g fill="#a6bbd5" font-size="12"><text x="744" y="140">Value · A</text><text x="744" y="280">Value · B</text><text x="940" y="205">Add</text><text x="1176" y="205">Square</text></g><g fill="#edf3fb" font-size="24" font-weight="600"><text x="744" y="174">2</text><text x="744" y="314">3</text><text x="940" y="245">5</text><text x="1176" y="245" fill="#86dfbe">25</text></g><g fill="#8da9cc" stroke="#111820" stroke-width="2"><circle cx="850" cy="153" r="5"/><circle cx="850" cy="293" r="5"/><circle cx="920" cy="223" r="5"/><circle cx="1070" cy="223" r="5"/><circle cx="1156" cy="223" r="5" fill="#86dfbe"/></g><text x="926" y="323" fill="#7e94b0" font-size="14">(A + B)² = 25</text><text x="726" y="75" fill="#647c98" font-size="11" letter-spacing="2">A CALCULATION YOU CAN FOLLOW</text></g></svg>